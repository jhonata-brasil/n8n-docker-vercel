# n8n leve no Render (plano free).
# Constrói Alpine + n8n 1.121.3 (um processo, sem runner 2.x).
# O free dorme após ~15 min e o Postgres free expira em 30 dias.

services:
  - type: web
    plan: free
    runtime: docker
    name: n8n-service
    branch: setup-n8n
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_LISTEN_ADDRESS
        value: "0.0.0.0"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=350"
      - key: N8N_RUNNERS_ENABLED
        value: "false"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        fromService:
          name: n8n-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: WEBHOOK_URL
        fromService:
          name: n8n-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ
        value: America/Sao_Paulo
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_CONNECTION_TIMEOUT
        value: "60000"
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "5"
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

databases:
  - name: n8n-db
    plan: free
